# Alterbrain CV data. Synthetic example: Alex Doe is not a real person.
# The render skill fills this file from vault/80_me/USER.md, vault/80_me/fact-sheet.md
# and vault/20_areas/career/. Both CV layouts (cv.qmd and cv-ats.qmd) read it.
#
# Rules for every value:
#  - Plain text only. No markdown, no emoji. Avoid * ` ~ < > because Quarto reads them as formatting.
#  - Put every value in double quotes.
#  - Only facts the person has confirmed. Leave a field out rather than guess it.
#  - Dates are text, for example "2022 - 2024" or "Sep 2025 - present".
#
# An entry can have: title, description (usually the organisation), location, date,
# and details (a list of short bullet points, each starting with a verb and ending with a result).

