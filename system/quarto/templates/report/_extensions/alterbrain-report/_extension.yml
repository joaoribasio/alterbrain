title: Alterbrain report
author: Alterbrain contributors
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    typst:
      papersize: a4
      fontsize: 11pt
      margin:
        x: 2.5cm
        y: 2.5cm
      section-numbering: "1.1"
      page-numbering: "1"
      csl: apa.csl
      line-spacing: 1.15
      paragraph-spacing: 0.9em
      filters:
        - report.lua
      template-partials:
        - biblio.typ
        - typst-template.typ
        - typst-show.typ
