title: Alterbrain deck
author: Alterbrain contributors
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    revealjs:
      theme:
        - default
        - alterbrain.scss
      width: 1280
      height: 720
      margin: 0.07
      center: false
      transition: none
      slide-number: true
      hash: true
      controls: true
      incremental: false
      embed-resources: true
      pdf-max-pages-per-slide: 1
      pdf-separate-fragments: false
